<section class="get-start-wrapper" id="contacts">
	<div class="container">
		<div class="get-start">
			<p class="label-text">
				GET STARTED
			</p>
			<h2 class="get-start__title">
				Business onboarding
			</h2>
			<p class="get-start__text">
				Submit your details and our team will reach out to discuss your needs
			</p>
			<form class="get-start__form" action="#">
				<div class="get-start__form-item">
					<label for="form-name" class="form-label">Full name</label>
					<input type="text" class="form-control" name="form-name" id="form-name" placeholder="John Smith">
				</div>
				<div class="get-start__form-item">
					<label for="form-email" class="form-label">Email address</label>
					<input type="email" class="form-control" name="form-email" id="form-email" placeholder="john@company.com">
				</div>
				<div class="get-start__form-item">
					<button class="btn btn-form" type="button">
						Submit application →
					</button>
				</div>
			</form>
			<p class="get-start__ps">
				By submitting you agree to our Privacy Policy. We do not share your data with third parties
			</p>
		</div>
	</div>
</section>
