<!doctype html><html lang="uk"><head>	<meta charset="UTF-8">	<meta name="viewport"		  content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">	<meta http-equiv="X-UA-Compatible" content="ie=edge">	<title>Page-FAQ</title>	<link rel="shortcut icon" href="./img/favicon.ico" type="image/x-icon">	<link rel="stylesheet" href="./css/default/style.min.css">	<link rel="stylesheet" href="./css/lib/bootstrap.v5.3.3.min.css">	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@9/swiper-bundle.min.css">	<link rel="stylesheet" href="./css/pages/page-faq.min.css"></head><body class="d-flex flex-column min-vh-100"><header class="header-wrapper">	<div class="container">		<div class="header">			<a class="header__logo" href="">				<picture><source srcset="./img/logo.svg" type="image/webp"><img src="./img/logo.svg" alt=""></picture>			</a>			<nav class="header__nav">				<a class="header__nav-link" href="">					Solutions				</a>				<a class="header__nav-link" href="">					Services				</a>				<a class="header__nav-link" href="">					About				</a>				<a class="header__nav-link" href="">					Contacts				</a>			</nav>			<div class="header__actions">				<div class="header__actions-item">					<div class="dropdown lang">						<button class="btn btn-secondary dropdown-toggle" type="button" data-bs-toggle="dropdown" aria-expanded="false">							EN						</button>						<ul class="dropdown-menu">							<li>								<a class="dropdown-item active" href="#">									<span>English</span>								</a>							</li>							<li>								<a class="dropdown-item" href="#">									<span>Deutsch</span>								</a>							</li>							<li>								<a class="dropdown-item" href="#">									<span>Français</span>								</a>							</li>							<li>								<a class="dropdown-item" href="#">									<span>Italiano</span>								</a>							</li>						</ul>					</div>				</div>				<div class="header__actions-item">					<a class="btn btn-stated" href="#">						<span>							Get Started						</span>						<svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">							<path d="M12 22C17.51 22 22 17.51 22 12C22 6.49 17.51 2 12 2C6.49 2 2 6.49 2 12C2 17.51 6.49 22 12 22ZM10.21 9C9.92 8.71 9.92 8.23 10.21 7.94C10.36 7.79 10.55 7.72 10.74 7.72C10.93 7.72 11.12 7.79 11.27 7.94L14.8 11.47C15.09 11.76 15.09 12.24 14.8 12.53L11.27 16.06C10.98 16.35 10.5 16.35 10.21 16.06C9.92 15.77 9.92 15.29 10.21 15L13.21 12L10.21 9Z" fill="#FAFAF7" />						</svg>					</a>				</div>				<div class="header__actions-item">					<button class="btn" type="button">						<svg width="20" height="23" viewBox="0 0 20 23" fill="none" xmlns="http://www.w3.org/2000/svg">							<rect y="4" width="20" height="1.5" fill="white" />							<rect y="10.5" width="20" height="1.5" fill="white" />							<rect y="17" width="20" height="1.5" fill="white" />						</svg>					</button>				</div>			</div>		</div>	</div></header><main class="wrapper">	<section class="faq-wrapper">	<div class="container">		<div class="faq">				</div>	</div></section></main><footer class="footer__wrapper">	<div class="container">		<div class="footer">				</div>	</div></footer><!-- початок цей блок ще в розробці _modal	--><div class="modal fade" id="geoModal" tabindex="-1" aria-labelledby="geoModalLabel" aria-hidden="true">	<div class="modal-dialog modal-dialog-centered modal-lg">		<div class="modal-content">			<div class="modal-body">				<div class="modal-body-l d-flex align-items-center justify-content-between">					<h4 class="modal-title" id="exampleModalLabel">						<span>Локация</span>					</h4>					<button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>				</div>				<div class="modal-body-l">					<label for="address">Адрес</label>					<input type="text" id="address" class="form-control">					<div id="addressStatus" class="address-status">Оберіть місце на карті</div>				</div>				<div class="modal-body-l">					<div class="row">						<div class="col-12">							<span class="label">Координаты</span>						</div>						<div class="col-6">							<label class="d-block">								<input type="text" id="latitude" class="form-control" placeholder="Широта" readonly>							</label>						</div>						<div class="col-6">							<label class="d-block">								<input type="text" id="longitude" class="form-control" placeholder="Долгота"									   readonly>							</label>						</div>					</div>				</div>				<div id="map-container"></div>				<div class="modal-body-l mt-3">					<button id="saveLocation" class="btn btn-primary">Сохранить</button>				</div>			</div>		</div>	</div></div><!-- кінець цей блок ще в розробці _modal	--><script src="./js/lib/popper.v2.11.8.min.js"></script><script src="./js/lib/bootstrap.v5.3.3.min.js"></script><script src="https://cdn.jsdelivr.net/npm/swiper@9/swiper-bundle.min.js"></script><script src="./js/pages/page-home.min.js" type="module"></script></body></html>
